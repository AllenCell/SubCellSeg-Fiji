# Publish a release: build the jar, attach it to a GitHub release and push it to the
# Fiji update site (https://allencell.github.io/SubCellSeg-Fiji/, served from the gh-pages branch).
#
# Trigger: push a tag "v<version>" that matches the version in pom.xml, e.g.
#   git tag v0.2.0 && git push origin v0.2.0
# or run it by hand from the Actions tab (workflow_dispatch) for the current commit.
#
# The update site is written by the Fiji Updater itself (its "file:" upload protocol) into a
# checkout of gh-pages, so db.xml.gz is always consistent with what the Updater expects.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Download Fiji
        run: |
          curl -sSL -o fiji.zip https://downloads.imagej.net/fiji/latest/fiji-latest-linux64-jdk.zip
          unzip -q fiji.zip
          FIJI=""
          for d in Fiji Fiji.app; do [[ -d "$d" ]] && FIJI="$d" && break; done
          [[ -n "$FIJI" ]] || { echo "No Fiji folder after unzip:"; ls; exit 1; }
          echo "FIJI=$GITHUB_WORKSPACE/$FIJI" >> "$GITHUB_ENV"

      - name: Build the jar
        run: |
          ./build.sh "$FIJI"
          JAR="$(ls build/SubCellSeg_Fiji-*.jar)"
          VERSION="$(basename "$JAR" .jar | sed 's/^SubCellSeg_Fiji-//')"
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pom.xml version $VERSION"; exit 1
          fi

      - name: Update the Fiji update site (gh-pages)
        run: |
          # Make this Fiji follow the site with a local "file:" upload target, so the Updater pulls
          # the current index, then uploads the complete site state (the new jar replaces the old one).
          "$FIJI/fiji" --headless --update edit-update-site SubCellSeg \
              https://allencell.github.io/SubCellSeg-Fiji/ file:localhost "$GITHUB_WORKSPACE/site/"
          rm -f "$FIJI"/plugins/SubCellSeg_Fiji-*.jar
          cp "$JAR" "$FIJI/plugins/"
          "$FIJI/fiji" --headless --update upload-complete-site --force SubCellSeg
          cd site
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@github.com \
              commit -m "Update site: SubCellSeg_Fiji $VERSION" || echo "site unchanged"
          git push origin gh-pages

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$JAR" --title "SubCellSeg Fiji plugin $VERSION" --generate-notes
